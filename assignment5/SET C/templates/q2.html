<!DOCTYPE html>
<html>
<head>
    <title>Product Order</title>
</head>
<body>

<h2>Product Order Form</h2>

<form method="POST">

    Product Name:
    <input type="text" name="product">

    Quantity:
    <input type="number" name="quantity">
    <br><br>

    Price:
    <input type="number" name="price">
    <br><br>

    <input type="submit" value="Place Order">

</form>

</body>
</html>
